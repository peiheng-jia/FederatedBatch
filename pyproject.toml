[build-system]
requires = ["setuptools==75.3.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "federatedbatch"
version = "0.3.0"
description = "Reproducible federated contrastive learning for single-cell batch correction"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}
authors = [
  {name = "Peiheng Jia"},
  {name = "Yu Sun"},
  {name = "Hebing Chen"},
  {name = "Jinbo Xiong"},
]
dependencies = [
  "anndata==0.10.5.post1",
  "harmonypy==0.0.9",
  "h5py==3.10.0",
  "leidenalg==0.10.2",
  "matplotlib==3.8.2",
  "nbformat==5.9.2",
  "numpy==1.26.4",
  "pandas==2.1.4",
  "plotly==5.18.0",
  "python-igraph==0.11.4",
  "PyYAML==6.0.1",
  "scanpy==1.9.8",
  "scikit-learn==1.3.2",
  "scikit-misc==0.3.1",
  "scipy==1.11.4",
  "seaborn==0.13.1",
  "torch==2.1.2",
  "tqdm==4.66.1",
  "umap-learn==0.5.5",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4", "ruff==0.1.15"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["federatedbatch*", "concord*"]

[tool.setuptools.package-data]
concord = ["LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/concord", "third_party"]
